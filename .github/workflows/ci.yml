name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  quick-checks:
    if: ${{ github.event_name != 'push' || github.event.pull_request == null }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        run: cargo install trunk

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.0"

      - name: Install Tauri dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Build Leptos UI (WASM)
        run: cd ui && trunk build

      - run: cargo check --workspace

      - name: Run Rust formatting check
        run: cargo fmt --check

      - name: Run Rust unit tests
        run: cargo test --workspace --lib --all-features

      - name: Run Rust integration tests
        run: |
          cd core
          echo "::group::Export Integration Test"
          cargo test --test export_integration_test -- --nocapture
          echo "::endgroup::"

          echo "::group::Timeline Integration Test"
          cargo test --test timeline_integration_test -- --nocapture
          echo "::endgroup::"

          echo "::group::RMarkdown Integration Test"
          cargo test --test rmarkdown_integration_test -- --nocapture
          echo "::endgroup::"

          echo "::group::Tool Manifests Test"
          cargo test --test tool_manifests_test -- --nocapture
          echo "::endgroup::"

          echo "::group::Viral Phylogenomics Workflow Test (Demo Scenario)"
          cargo test --test viral_phylogenomics_workflow_test -- --nocapture
          echo "::endgroup::"

      - name: Run Protocol tests
        run: cargo test -p reprod-protocol

      - name: Install Tokei
        run: |
          wget -qO- https://github.com/XAMPPRocky/tokei/releases/download/v12.1.2/tokei-x86_64-unknown-linux-gnu.tar.gz | tar xvz
          sudo mv tokei /usr/local/bin/

      - name: Generate LOC Statistics
        run: |
          echo "## Lines of Code (LOC) Statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          tokei >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Test Summary
        if: always()
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backend Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Unit tests: cargo test --lib" >> $GITHUB_STEP_SUMMARY
          echo "- Integration tests: 5 test suites" >> $GITHUB_STEP_SUMMARY
          echo "  - Export integration" >> $GITHUB_STEP_SUMMARY
          echo "  - Timeline integration" >> $GITHUB_STEP_SUMMARY
          echo "  - RMarkdown export" >> $GITHUB_STEP_SUMMARY
          echo "  - Tool manifests validation" >> $GITHUB_STEP_SUMMARY
          echo "  - Demo workflow (6-step viral phylogenomics)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Protocol Tests" >> $GITHUB_STEP_SUMMARY
          echo "- WebSocket message serialization/deserialization" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Leptos UI" >> $GITHUB_STEP_SUMMARY
          echo "- WASM build verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**Architecture**: Pure Rust (Leptos + Tauri)" >> $GITHUB_STEP_SUMMARY
