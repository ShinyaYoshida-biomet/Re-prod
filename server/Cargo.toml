# WebSocket
axum-extra = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
similar = "2.6"

# Logging
tracing = { workspace = true }
