[workspace]
members = [
    "core",
    "desktop",
    "server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Re-prod Team"]
license = "MIT"
rust-version = "1.77.2"

[workspace.dependencies]
# Internal crates
reprod-core = { path = "core" }

# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-stream = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Tauri (desktop only)
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Process spawning & temp files
tempfile = "3"
uuid = { version = "1.10", features = ["v4"] }

# HTTP client (for AI)
reqwest = { version = "0.12", features = ["json"] }

# Async trait
async-trait = "0.1"

# Base64 encoding
base64 = "0.22"

# Directory utilities
dirs = "5"

# Config parsing
toml = "0.8"

# Web framework (server only)
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
axum-extra = { version = "0.9", features = ["typed-header"] }

[workspace.lints]
rust = {}

[workspace.lints.clippy]
# Codex-inspired strict linting (10+ rules)
unwrap_used = "deny"
expect_used = "deny"
manual_map = "deny"
manual_flatten = "deny"
needless_borrow = "deny"
redundant_clone = "deny"
unnecessary_to_owned = "deny"
redundant_closure = "deny"
needless_collect = "deny"
trivially_copy_pass_by_ref = "deny"

[profile.release]
opt-level = "z"        # Optimize for size
lto = "fat"            # Link-time optimization
codegen-units = 1      # Single codegen unit (Codex pattern)
strip = "symbols"      # Strip symbols (Codex pattern)
